name: Bootstrap MOB dashboard from LIX

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-mob.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap-mob.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-mob-dashboard
  cancel-in-progress: false

jobs:
  port-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out MOB repository
        uses: actions/checkout@v5
        with:
          ref: main
          path: mob

      - name: Check out working LIX dashboard
        uses: actions/checkout@v5
        with:
          repository: JacZerin24/lix-summer-climate-dashboard
          ref: main
          path: lix

      - name: Copy dashboard implementation
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.bootstrap' \
            --exclude='.github/workflows/bootstrap-mob.yml' \
            lix/ mob/

      - name: Configure Mobile and Pensacola climate sites
        id: configure
        continue-on-error: true
        run: |
          set +e
          {
            python mob/.bootstrap/port_to_mob.py mob
            python mob/.bootstrap/postprocess_mob.py
          } > mob/.bootstrap/last-run.log 2>&1
          status=$?
          cat mob/.bootstrap/last-run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish conversion diagnostic
        if: steps.configure.outputs.status != '0'
        working-directory: mob
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bootstrap/last-run.log
          git commit -m "debug: capture MOB bootstrap conversion failure"
          git push origin HEAD:main
          exit 1

      - name: Compile Python scripts
        if: steps.configure.outputs.status == '0'
        working-directory: mob
        run: python -m compileall -q scripts

      - name: Set up Node
        if: steps.configure.outputs.status == '0'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and test dashboard
        if: steps.configure.outputs.status == '0'
        working-directory: mob
        run: |
          npm install
          npm test
          npm run build

      - name: Remove one-time bootstrap files
        if: steps.configure.outputs.status == '0'
        working-directory: mob
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-mob.yml

      - name: Commit ported dashboard
        if: steps.configure.outputs.status == '0'
        working-directory: mob
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "MOB dashboard is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: port LIX summer climate dashboard to WFO MOB"
          git push origin HEAD:main
