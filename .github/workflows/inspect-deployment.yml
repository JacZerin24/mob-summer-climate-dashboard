name: Initialize and inspect MOB Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".deployment-diagnostic/**"

permissions:
  contents: read
  actions: read
  pages: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize GitHub Pages when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" > /tmp/pages-before.json 2>/dev/null; then
            echo "GitHub Pages is already initialized."
          else
            echo "Creating GitHub Pages site with Actions as the build source."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
          fi

      - name: Show GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages"

      - name: Show recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=10" \
            --jq '.workflow_runs[] | [.id, .name, .event, .status, (.conclusion // "pending"), .head_sha, .created_at] | @tsv'
