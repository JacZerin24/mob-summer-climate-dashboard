name: Fix MOB social handle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".social-handle-fix/**"

permissions:
  contents: write

jobs:
  update-handle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Replace inherited LIX social handle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/graphic-builder.js")
          text = path.read_text(encoding="utf-8")
          old = 'context.fillText("𝕏  f  @NWSNewOrleans", 240, 1058);'
          new = 'context.fillText("𝕏  f  @NWSMobile", 240, 1058);'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one inherited social handle, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify Mobile footer branding
        run: |
          ! grep -F '@NWSNewOrleans' src/components/graphic-builder.js
          grep -F 'context.fillText("NWS Mobile, AL", 140, 1023);' src/components/graphic-builder.js
          grep -F 'context.fillText("𝕏  f  @NWSMobile", 240, 1058);' src/components/graphic-builder.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit social-handle correction
        run: |
          if git diff --quiet -- src/components/graphic-builder.js; then
            echo "Social handle is already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/graphic-builder.js
          git commit -m "fix: use NWS Mobile social handle in graphics"
          git push origin HEAD:main
