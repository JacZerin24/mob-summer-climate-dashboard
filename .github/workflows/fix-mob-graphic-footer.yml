name: Fix MOB graphic footer label

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".footer-fix/**"

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Replace inherited LIX footer label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/graphic-builder.js")
          text = path.read_text(encoding="utf-8")
          old = 'context.fillText("New Orleans/Baton Rouge", 140, 1023);'
          new = 'context.fillText("NWS Mobile, AL", 140, 1023);'
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one inherited footer label, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify inherited label is gone
        run: |
          ! grep -F 'New Orleans/Baton Rouge' src/components/graphic-builder.js
          grep -F 'context.fillText("NWS Mobile, AL", 140, 1023);' src/components/graphic-builder.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit footer correction
        run: |
          if git diff --quiet -- src/components/graphic-builder.js; then
            echo "Footer label is already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/graphic-builder.js
          git commit -m "fix: label climate graphics for NWS Mobile"
          git push origin HEAD:main
